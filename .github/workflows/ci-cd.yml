name: KeepCopy CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.6.0" "pathspec>=0.12.1" "pytest>=8.0.0"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

  build:
    name: Build
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: C:\NuitkaCache
          key: nuitka-win-py310-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            nuitka-win-py310-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m nuitka --version

      - name: Build exe
        env:
          NUITKA_CACHE_DIR: C:\NuitkaCache
        run: python scripts/build_exe.py

      - name: Pack zip
        run: python scripts/pack_dist.py

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepcopy-zip
          path: compiler/KeepCopy.zip
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: keepcopy-zip
          path: dist-upload

      - name: Ensure deploy directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script: mkdir -p "$DEPLOY_PATH"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Upload zip
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: dist-upload/KeepCopy.zip
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Verify on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH
          script_path: .github/deploy_ssh.sh
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
